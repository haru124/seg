# config/experiments/exp_01.yaml
# ================================
# Experiment 1: ResNet50 + SGD + OHEM CE (paper baseline)
#
# This follows the DeepLabV3+ paper exactly:
#   - ResNet50 backbone with output_stride=16
#   - SGD optimizer with poly learning rate decay
#   - Online Hard Example Mining (OHEM) Cross-Entropy loss
#   - Auxiliary loss from intermediate decoder
#
# Expected mIoU on Cityscapes val: ~79%

experiment:
  id: "exp01_resnet50_sgd_ohem"
  description: "DeepLabV3+ ResNet50, SGD poly-lr, OHEM CE — paper baseline"

model:
  backbone: "resnet50"
  output_stride: 16
  pretrained_backbone: true

training:
  epochs: 80
  lr: 0.007
  lr_scheduler: "poly"
  momentum: 0.9
  weight_decay: 1.0e-4
  optimizer: "sgd"
  aux_loss: true
  aux_weight: 0.4
  amp: true
  accumulation_steps: 4
  grad_clip: null

loss:
  type: "ohem"
  kwargs:
    thresh: 0.7
    min_kept: 100000
    aux_weight: 0.4

tracking:
  mlflow:
    enabled: true
    tracking_uri: "outputs/mlruns"
    experiment_name: "exp01_resnet50_sgd_ohem"
  tensorboard:
    enabled: true
    log_dir: "outputs/tensorboard/exp01"

checkpoint:
  dir: "outputs/checkpoints/exp01"
  save_top_k: 3
  resume: null
