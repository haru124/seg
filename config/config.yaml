# config/config.yaml
project:
  name: "seg"
  seed: 42

data:
  root: "data"
  dataset: "cityscapes"
  num_classes: 19
  ignore_index: 255
  image_size: [512, 1024]   # H x W — safe for 4GB VRAM
  batch_size: 4
  num_workers: 4

model:
  name: "deeplabv3_plus"
  backbone: "resnet50"       # resnet50 | resnet34 | mobilenet_v2
  output_stride: 16          # 8 or 16; 16 is lighter on memory
  pretrained_backbone: true
  pretrained_weights: null   # path to weights file or null

training:
  epochs: 80
  lr: 0.007
  lr_scheduler: "poly"       # poly | cosine | step
  momentum: 0.9
  weight_decay: 1.0e-4
  aux_loss: true
  aux_weight: 0.4
  grad_clip: null
  amp: true                  # mixed precision — must for 4GB GPU
  accumulation_steps: 4      # effective batch = batch_size * accumulation_steps

loss:
  type: "cross_entropy"      # cross_entropy | focal | ohem
  class_weights: null

evaluation:
  interval: 1                # validate every N epochs
  metrics: ["mIoU", "pixAcc"]

tracking:
  mlflow:
    enabled: true
    tracking_uri: "outputs/mlruns"
    experiment_name: "deeplabv3plus_cityscapes"
  tensorboard:
    enabled: true
    log_dir: "outputs/tensorboard"

checkpoint:
  dir: "outputs/checkpoints"
  save_top_k: 3             # keep top-k by val mIoU
  resume: null              # path to checkpoint or null

onnx:
  export_dir: "outputs/onnx"
  opset: 17
  input_shape: [1, 3, 512, 1024]