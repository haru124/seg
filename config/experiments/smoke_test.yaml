experiment_id: "smoke_test"

model:
  backbone: "resnet50"
  output_stride: 8  #=8 -> layer 3 (dilation = 2, stride = 1, H/8) and layer 4 (dilation = 4, stride = 1, H/8)  if output_stride =16, only layer 4 dilation=2, H/
  use_pretrained_backbone: false
  backbone_weights_path: "weights/resnet50.pth"

data:
  root: "data"
  dataset: "cityscapes"
  num_classes: 19
  ignore_index: 255
  image_size: [256, 512]
  batch_size: 2
  num_workers: 0
  max_samples: null

training:
  epochs: 1
  lr: 0.01
  lr_scheduler: "poly"
  momentum: 0.9
  weight_decay: 1.0e-4
  optimizer: "sgd"
  aux_loss: true
  aux_weight: 0.4
  grad_clip: null
  amp: false
  accumulation_steps: 1

loss:
  type: "ce"
  kwargs: {}

tracking:
  mlflow_enabled: false
  tb_enabled: false
  tb_log_dir: "outputs/tensorboard"
  mlflow_uri: "outputs/mlruns"
  mlflow_experiment: "smoke_test"

checkpoint:
  save_top_k: 1
  dir: "outputs/checkpoints/smoke_test"
  resume: null

evaluation:
  interval: 1