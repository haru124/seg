# exp_01: ResNet50 + SGD + OHEM CE  (closest to DeepLabV3+ paper)
# name: exp01_resnet50_sgd_ohem

experiment:
  id: "exp01_resnet50_sgd_ohem"
  description: "DeepLabV3+ ResNet50, SGD poly-lr, OHEM CE loss — strong paper baseline"

model:
  backbone: "resnet50"
  output_stride: 16
  pretrained_backbone: true

training:
  epochs: 80
  lr: 0.007
  lr_scheduler: "poly"
  momentum: 0.9
  weight_decay: 1.0e-4
  optimizer: "sgd"
  aux_loss: true
  aux_weight: 0.4
  amp: true
  accumulation_steps: 4

loss:
  type: "ohem"
  thresh: 0.7
  min_kept: 100000

tracking:
  mlflow:
    enabled: true
    tracking_uri: "outputs/mlruns"
    experiment_name: "exp01_resnet50_sgd_ohem"
  tensorboard:
    enabled: true
    log_dir: "outputs/tensorboard/exp01_resnet50_sgd_ohem"

checkpoint:
  dir: "outputs/checkpoints/exp01_resnet50_sgd_ohem"
  save_top_k: 3
  resume: null