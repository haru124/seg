# config/experiments/exp1.yaml
# ================================
# Experiment 1: ResNet50 + SGD + Weighted CE
#
# This follows the DeepLabV3+ paper exactly:
#   - ResNet50 backbone with output_stride=16
#   - SGD optimizer with poly learning rate decay
#   - Weighted CE

#   - Auxiliary loss from intermediate decoder
#
# Expected mIoU on Cityscapes val: ~79%

experiment:
  id: "exp1_resnet50_sgd_wce"
  description: "DeepLabV3+ ResNet50, SGD poly-lr, Weighted CE"

data:
  image_size: [512, 1024]      # [H, W] — safe for 4 GB VRAM
  batch_size: 4
  num_workers: 4
  max_train_samples: 500 #10            # for debugging; null = use full dataset
  max_val_samples: 93 #4
  max_test_samples: 55 #2


model:
  backbone: "resnet50"
  output_stride: 16 #layer 4 dilation = 2    H/16

  use_pretrained_backbone: true
  backbone_weights_path: "weights/resnet50.pth"
  use_jpu: false

training:
  epochs: 50
  lr: 0.005
  lr_scheduler: "poly"
  momentum: 0.9
  weight_decay: 1.0e-4
  optimizer: "sgd"
  aux_loss: true
  aux_weight: 0.4
  amp: true
  accumulation_steps: 1
  grad_clip: null   #1.0
  early_stopping_patience: 15 #stop if no mIoU improvement for 5 epochs
  early_stopping_min_delta: 0.001  # minimum improvement to count



#loss:
 # type: "ohem"
  #kwargs:
   # thresh: 0.7
    #min_kept: 100000
    #aux_weight: 0.4

loss:
  type: "weighted_ce"                    # cross_entropy | focal | ohem | ce_dice | lovasz_ce | focal_dice
  kwargs: {}

tracking:
  mlflow:
    enabled: true
    tracking_uri: "outputs/mlruns"
    experiment_name: "exp1_resnet50_sgd_ce"
  tensorboard:
    enabled: true
    log_dir: "outputs/tensorboard/exp1"

checkpoint:
  dir: "outputs/checkpoints/exp1"
  save_top_k: 3
  resume: "outputs/checkpoints/exp1/exp1_resnet50_sgd_wce_epoch023_loss0.4186_mIoU0.4266.pth"
  #resume: "outputs/checkpoints/exp01/exp01_resnet50_os16_epoch023_loss1.234_mIoU0.456.pth"